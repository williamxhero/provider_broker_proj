[project]
name = "provider-broker"
version = "0.1.63"
description = "Private provider routing broker"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "cryptography>=43", "jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.54"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["provider_broker*"]

[tool.setuptools.package-data]
provider_broker = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
