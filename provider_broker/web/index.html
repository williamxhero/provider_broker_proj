<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Broker 管理控制台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <section aria-labelledby="quality-title">
      <div class="section-heading">
        <div><p class="index">01 / QUALITY</p><h2 id="quality-title">调用质量</h2></div>
        <nav id="windows" class="segmented" aria-label="质量时间窗">
          <button type="button" data-window="1h">1h</button>
          <button type="button" data-window="24h" class="active">24h</button>
          <button type="button" data-window="7d">7d</button>
          <button type="button" data-window="30d">30d</button>
        </nav>
      </div>
      <div id="quality" class="quality-grid"></div>
    </section>

    <section aria-labelledby="providers-title">
      <div class="section-heading">
        <div><p class="index">02 / ROUTING</p><h2 id="providers-title">API Key</h2></div>
        <div class="section-actions"><div class="sync-control"><button id="sync" class="primary" type="button">从 CPA 手动同步</button><small>最近同步：<time id="syncat">n/a</time></small></div></div>
      </div>
      <output id="syncresult" class="notice" aria-live="polite"></output>
      <div class="table-wrap"><table id="providers"></table></div>
    </section>

    <section aria-labelledby="model-view-title">
      <div class="section-heading">
        <div><p class="index">03 / STAGE VIEW</p><h2 id="model-view-title">Stage视角</h2></div>
        <div class="section-actions"><label>同价竞速 Key 数<input id="race-parallel-cap" type="number" min="1" max="32" step="1" required></label><button id="save-routing" class="secondary" type="button">保存</button></div>
      </div>
      <div class="table-wrap"><table id="model-view"></table></div>
    </section>

    <section aria-labelledby="catalog-title">
      <div class="section-heading">
        <div><p class="index">04 / CATALOG</p><h2 id="catalog-title">模型费率</h2></div>
        <div class="section-actions"><button id="catalog-apply" class="secondary" type="button">应用目录到库存</button><button id="catalog-create" class="secondary" type="button">新增模型</button></div>
      </div>
      <div class="table-wrap"><table id="catalog"></table></div>
    </section>

    <section aria-labelledby="calls-title">
      <div class="section-heading">
        <div><p class="index">05 / AUDIT</p><h2 id="calls-title">调用记录</h2></div>
        <div class="filters">
          <label>时间窗<select id="callwindow"><option>1h</option><option selected>24h</option><option>7d</option><option>30d</option></select></label>
          <label>每页<select id="calllimit"><option>2</option><option>10</option><option selected>25</option></select></label>
          <label>Provider<input id="callprovider" type="search" placeholder="指纹或 Provider"></label>
          <label>状态<input id="callstatus" type="search" placeholder="成功、超时"></label>
        </div>
      </div>
      <div class="table-wrap"><table id="calls"></table></div>
      <button id="next" class="secondary" type="button">下一页</button>
    </section>
  </main>

  <aside id="editor" class="editor" aria-labelledby="editor-title" hidden>
    <form id="policy">
      <div class="editor-heading"><div><p class="index">POLICY</p><h2 id="editor-title">编辑 API Key</h2></div><button id="close-editor" type="button" aria-label="关闭">×</button></div>
      <p id="editor-source" class="source-note"></p>
      <label>备注<input name="note" type="text"></label>
      <label>倍率<input name="multiplier" type="number" min="0.001" step="0.001" required></label>
      <label class="toggle"><input name="enabled" type="checkbox">启用</label>
      <label>单 Key 并发上限<input name="max_parallel" type="number" min="1" max="32" step="1" required></label>
      <p class="field-help">此 Key 同时在飞的上游请求上限；达到上限时不会被抽入竞速，以保护上游配额。它不影响一次竞速会随机抽几个 Key。</p>
      <div class="editor-actions"><button id="cancel-editor" type="button" class="secondary">取消</button><button type="submit" class="primary">保存</button></div>
    </form>
  </aside>

  <aside id="catalog-editor" class="editor" aria-labelledby="catalog-editor-title" hidden>
    <form id="catalog-form">
      <div class="editor-heading"><div><p class="index">MODEL ROUTING</p><h2 id="catalog-editor-title">模型目录</h2></div><button id="close-catalog-editor" type="button" aria-label="关闭">×</button></div>
      <p class="source-note">费率按每百万 token 计。整合价固定为 4% 未缓存输入 + 16% 缓存输入 + 80% 输出；stage 是路由分区，而非质量承诺。</p>
      <label>模型 ID<input name="model" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,127}" required></label>
      <label>模型家族<input name="family" required></label>
      <label>stage<select name="intellect"><option value="standard">standard</option><option value="smart">smart</option><option value="expert">expert</option></select></label>
      <label>输入费率 / 1M<input name="official_input_price" type="number" min="0" step="0.0001" required></label>
      <label>缓存输入费率 / 1M<input name="official_cache_price" type="number" min="0" step="0.0001" required></label>
      <label>输出费率 / 1M<input name="official_output_price" type="number" min="0" step="0.0001" required></label>
      <label>整合价 / 1M<input name="blended_price" type="text" readonly aria-readonly="true"></label>
      <div class="editor-actions"><button id="catalog-delete" type="button" class="danger" hidden>删除模型</button><button id="cancel-catalog-editor" type="button" class="secondary">取消</button><button type="submit" class="primary">保存</button></div>
    </form>
  </aside>

  <script src="/static/app.js" defer></script>
</body>
</html>
